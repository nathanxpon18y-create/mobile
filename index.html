<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bloco de Notas</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            max-width: 900px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        #status {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            width: 100%;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 Bloco de Notas</h1>
        <span id="status">Pronto</span>
    </header>

    <div class="container">
        <textarea id="bloco" placeholder="Digite suas anotações aqui..."></textarea>
    </div>

    <script>
        const bloco = document.getElementById('bloco');
        const status = document.getElementById('status');
        let timeoutId = null;

        // Carrega o que estava salvo no LocalStorage ao abrir (provisório)
        const notaSalva = localStorage.getItem('minha_nota');
        if (notaSalva) {
            bloco.value = notaSalva;
        }

        // Simula o salvamento automático ao digitar
        bloco.addEventListener('input', () => {
            status.textContent = 'Salvando...';
            
            // Limpa o temporizador anterior
            clearTimeout(timeoutId);

            // Salva após 1 segundo sem digitar (evita sobrecarregar)
            timeoutId = setTimeout(() => {
                localStorage.setItem('minha_nota', bloco.value);
                
                // AQUI É ONDE VOCÊ CONECTARIA SEU BANCO DE DADOS (Supabase/Firebase)
                // salvarNoBancoDeDados(bloco.value);

                status.textContent = 'Salvo com sucesso!';
                
                setTimeout(() => {
                    status.textContent = 'Pronto';
                }, 2000);
            }, 1000);
        });
    </script>

</body>
</html>
