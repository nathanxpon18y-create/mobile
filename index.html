<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Atendimentos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
            --danger-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--accent-color);
            text-align: center;
        }

        h2 {
            font-size: 1.15rem;
            color: var(--text-color);
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 5px;
        }

        /* Formulário */
        .formulario {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .formulario input, 
        .formulario select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .formulario input:focus, 
        .formulario select:focus {
            border-color: var(--accent-color);
        }

        .formulario button[type="submit"] {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .formulario button[type="submit"]:hover {
            background-color: var(--accent-hover);
        }

        .formulario button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* Estatísticas */
        .estatisticas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .estatisticas p {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .estatisticas span {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        #totalCancelamentos {
            color: var(--danger-color);
        }

        /* Bloco de Notas */
        .bloco-notas {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            min-height: 120px;
            color: var(--text-color);
        }

        /* Rodapé */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Registro de Atendimentos</h1>

        <!-- FORMULÁRIO -->
        <form class="formulario" onsubmit="salvarAtendimento(); return false;">
            <input type="text" id="cliente" placeholder="Nome do cliente" required>
            <input type="text" id="contrato" placeholder="Contrato (000/000)" required>

            <select id="tipo">
                <option>Retido</option>
                <option>Suporte</option>
                <option>Venda</option>
                <option>Cancelado</option>
                <option>Transferida</option>
                <option>Informações</option>
                <option>Combo Multi</option>
            </select>

            <select id="status">
                <option>Informações do contrato</option>
                <option>Total</option>
                <option>Mudança de Pacote</option>
                <option>Mudança de Endereço</option>
                <option>Downgrade</option>
                <option>Upgrade</option>
                <option>Suspensão temporária</option>
                <option>Cancelamento MDE</option>
                <option>Agendamento de VT</option>
                <option>Venda Controle/ Pós Pago</option>
                <option>Transferida Supervisão</option>
                <option>Transferida Muda</option>
                <option>Ligar no 0800/*1052</option>
            </select>

            <input type="text" id="obs" placeholder="Observação rápida">
            <button type="submit">Salvar Atendimento</button>
        </form>

        <!-- ESTATÍSTICAS -->
        <div>
            <h2>Estatísticas</h2>
            <div id="estatisticas" class="estatisticas">
                <p>Total de Atendimentos: <span id="totalAtendimentos">0</span></p>
                <p>Total de Cancelamentos: <span id="totalCancelamentos">0</span></p>
                <p>Taxa de Cancelamento: <span id="taxaCancelamento">0%</span></p>
            </div>
        </div>

        <!-- BLOCO DE NOTAS -->
        <div>
            <h2>Bloco de Anotações</h2>
            <div id="blocoNotas" class="bloco-notas"></div>
        </div>

        <!-- RODAPÉ -->
        <footer>
            <span>Desenvolvido por Nathan Rocha |</span>
            <span>📞 <a href="tel:+5582993717863">(82) 99371-7863</a> |</span>
            <span>📧 <a href="mailto:nathanxpon18y@gmail.com">nathanxpon18y@gmail.com</a></span>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
